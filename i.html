<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intel Bureau - Landscape View</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Main Wrapper that holds the landscape content */
        #landscape-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            background-image: url('assets/menu-bg.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            transform-origin: center center;
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="landscape-wrapper"></div>

    <script>
        function forceLandscape() {
            const wrapper = document.getElementById('landscape-wrapper');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            // We use matchMedia to detect physical device orientation more reliably than window size alone
            const isLandscape = window.matchMedia("(orientation: landscape)").matches;

            if (!isLandscape) {
                // Portrait Mode: Force landscape rotation layout
                wrapper.style.width = windowHeight + 'px';
                wrapper.style.height = windowWidth + 'px';
                wrapper.style.transform = `translate(-50%, -50%) rotate(90deg)`;
            } else {
                // Auto-Rotate Landscape Mode: Check screen orientation angle API to handle both sides cleanly
                const angle = (screen.orientation && screen.orientation.angle !== undefined) ? screen.orientation.angle : window.orientation;

                if (angle === 270 || angle === -90) {
                    // Right-side landscape flip
                    wrapper.style.width = windowHeight + 'px';
                    wrapper.style.height = windowWidth + 'px';
                    wrapper.style.transform = `translate(-50%, -50%) rotate(-90deg)`;
                } else {
                    // Left-side landscape / standard landscape default
                    wrapper.style.width = windowHeight + 'px';
                    wrapper.style.height = windowWidth + 'px';
                    wrapper.style.transform = `translate(-50%, -50%) rotate(90deg)`;
                }
            }
        }

        // Run on load
        window.addEventListener('load', forceLandscape);

        // Run on resize/orientation change
        window.addEventListener('resize', forceLandscape);
        if (screen.orientation) {
            screen.orientation.addEventListener('change', forceLandscape);
        }
    </script>
</body>
</html>
