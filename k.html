<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intel Bureau - Landscape View</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Main Wrapper that holds the landscape content naturally */
        #landscape-wrapper {
            width: 100vw;
            height: 100vh;
            background-image: url('assets/menu-bg.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Orientation Warning Overlay */
        #orientation-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #orientation-warning h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        #orientation-warning p {
            font-size: 1rem;
            color: #aaa;
        }

        /* Show warning only when in portrait mode on mobile */
        @media screen and (orientation: portrait) {
            #orientation-warning {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- Warning Screen for Portrait Users -->
    <div id="orientation-warning">
        <div>
            <h2>Please Rotate Your Device</h2>
            <p>This experience is designed exclusively for landscape mode.</p>
        </div>
    </div>

    <!-- Main Game/App Content Wrapper -->
    <div id="landscape-wrapper"></div>

    <script>
        function lockLandscape() {
            // Attempt to natively lock orientation if the browser/device supports it
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function(error) {
                    console.log('Orientation lock not allowed or supported: ', error);
                });
            }
        }

        // Trigger orientation lock on the first user interaction (required by most browsers)
        window.addEventListener('click', lockLandscape, { once: true });
        window.addEventListener('touchstart', lockLandscape, { once: true });
    </script>
</body>
</html>
