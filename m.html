<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intel Bureau - Landscape View</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Main Wrapper that holds the landscape content */
        #landscape-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            background-image: url('assets/menu-bg.png');
            /* Changed from 'cover' to 'contain' so nothing is cropped out */
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transform-origin: center center;
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="landscape-wrapper"></div>

    <script>
        function forceLandscape() {
            const wrapper = document.getElementById('landscape-wrapper');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            // Check if device is currently in portrait mode
            if (windowWidth < windowHeight) {
                // Apply rotation and swap width/height dimensions to fit landscape perfectly
                wrapper.style.width = windowHeight + 'px';
                wrapper.style.height = windowWidth + 'px';
                wrapper.style.transform = `translate(-50%, -50%) rotate(90deg)`;
            } else {
                // Normal landscape orientation
                wrapper.style.width = '100vw';
                wrapper.style.height = '100vh';
                wrapper.style.transform = `translate(-50%, -50%) rotate(0deg)`;
            }
        }

        // Run on load
        window.addEventListener('load', forceLandscape);

        // Run on resize/orientation change
        window.addEventListener('resize', forceLandscape);
    </script>
</body>
</html>
