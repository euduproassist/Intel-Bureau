<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intel Bureau - Landscape View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Direct native landscape container */
        #landscape-wrapper {
            width: 100vw;
            height: 100vh;
            background-image: url('assets/menu-bg.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>

    <div id="landscape-wrapper"></div>

    <script>
        function lockLandscape() {
            // Silently request the browser to lock into landscape mode natively
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function(error) {
                    // Fails silently if the browser blocks it without a direct tap
                    console.log('Orientation lock info: ', error);
                });
            }
        }

        // Try locking on load immediately
        window.addEventListener('load', () => {
            lockLandscape();
        });

        // Also lock on the very first touch/click just in case the browser blocked the initial load attempt
        window.addEventListener('click', lockLandscape, { once: true });
        window.addEventListener('touchstart', lockLandscape, { once: true });
    </script>
</body>
</html>
